name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [bootstrap, platform, preview]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -diff -recursive infra
      - run: terraform -chdir=infra/${{ matrix.root }} init -backend=false -input=false
      - run: terraform -chdir=infra/${{ matrix.root }} validate
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --chdir=infra/${{ matrix.root }}

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install checkov
      - run: checkov --config-file .checkov.yaml
