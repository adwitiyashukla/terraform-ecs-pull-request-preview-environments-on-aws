name: platform

on:
  push:
    branches: [main]
    paths:
      - infra/platform/**
  pull_request:
    paths:
      - infra/platform/**

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: platform
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PLATFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - working-directory: infra/platform
        run: >-
          terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      - id: plan
        working-directory: infra/platform
        run: |
          terraform plan -input=false -no-color -out=plan.tfplan | tee plan.txt
          {
            echo "plan<<PLAN_EOF"
            tail -c 60000 plan.txt
            echo "PLAN_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v9
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        with:
          script: |
            const marker = "<!-- prenv-platform -->";
            const plan = process.env.PLAN;
            const body = `${marker}\nPlatform plan for ${context.sha.slice(0, 7)}\n\n<details><summary>terraform plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PLATFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - working-directory: infra/platform
        run: >-
          terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      - working-directory: infra/platform
        run: terraform apply -input=false -auto-approve
