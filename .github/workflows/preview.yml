name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  TTL_HOURS: ${{ vars.PREVIEW_TTL_HOURS || 24 }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: image
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag="pr-${PR_NUMBER}-${HEAD_SHA::7}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/prenv/app:${tag}" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name prenv/app --image-ids "imageTag=${tag}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.image.outputs.exists == 'false'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker build --tag "$IMAGE_REF" app
          docker push "$IMAGE_REF"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - working-directory: infra/preview
        run: >-
          terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=preview/pr-${PR_NUMBER}.tfstate"
          -backend-config="region=${AWS_REGION}"

      - id: apply
        working-directory: infra/preview
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          started=$(date +%s)
          terraform apply -input=false -auto-approve \
            -var "pr_number=${PR_NUMBER}" \
            -var "image_tag=${IMAGE_TAG}" \
            -var "state_bucket=${TF_STATE_BUCKET}" \
            -var "aws_region=${AWS_REGION}" \
            -var "ttl_hours=${TTL_HOURS}"
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"
          echo "expires_at=$(terraform output -raw expires_at)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -e .

      - id: wait
        run: |
          started=$(date +%s)
          python -m previewctl wait "$PR_NUMBER" --timeout 600
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"

      - run: python -m previewctl smoke "$PR_NUMBER"

      - uses: actions/github-script@v9
        env:
          URL: ${{ steps.apply.outputs.url }}
          EXPIRES_AT: ${{ steps.apply.outputs.expires_at }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          APPLY_SECONDS: ${{ steps.apply.outputs.seconds }}
          WAIT_SECONDS: ${{ steps.wait.outputs.seconds }}
        with:
          script: |
            const marker = "<!-- prenv -->";
            const pushedAt = Date.parse(context.payload.pull_request.updated_at);
            const total = Math.round((Date.now() - pushedAt) / 1000);
            const body = [
              marker,
              `Preview ready: ${process.env.URL}`,
              "",
              `image \`${process.env.IMAGE_TAG}\``,
              `terraform apply ${process.env.APPLY_SECONDS}s, healthy ${process.env.WAIT_SECONDS}s after apply, live ${total}s after the push`,
              `expires ${process.env.EXPIRES_AT}, or when this pull request closes`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -e .

      - id: destroy
        run: |
          started=$(date +%s)
          python -m previewctl destroy "$PR_NUMBER" --state-bucket "$TF_STATE_BUCKET" --infra-dir infra/preview
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v9
        env:
          DESTROY_SECONDS: ${{ steps.destroy.outputs.seconds }}
        with:
          script: |
            const marker = "<!-- prenv -->";
            const body = `${marker}\nPreview destroyed in ${process.env.DESTROY_SECONDS}s.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
