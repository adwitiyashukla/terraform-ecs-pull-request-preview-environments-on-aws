[project]
name = "prenv"
version = "0.1.0"
description = "Preview environments on AWS: one HTTPS URL per pull request on ECS Fargate"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
dev = [
  "fastapi==0.141.1",
  "uvicorn==0.46.0",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "python-multipart==0.0.26",
  "httpx>=0.28",
  "pytest>=9",
  "moto[all]>=5.2",
  "ruff>=0.15",
  "python-hcl2>=8",
  "pyyaml>=6",
]

[project.scripts]
previewctl = "previewctl.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["previewctl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["main", "previewctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "."]
